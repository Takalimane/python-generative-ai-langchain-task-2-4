[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-rag-agent"
version = "0.1.0"
description = "Grounded PDF RAG, tool agent, and Streamlit assistant"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.40,<2",
  "langchain>=0.3,<1",
  "langchain-community>=0.3,<1",
  "langchain-openai>=0.3,<1",
  "langchain-google-genai>=2,<3",
  "faiss-cpu>=1.8,<2",
  "pypdf>=5,<6",
  "python-dotenv>=1,<2",
  "tavily-python>=0.5,<1",
  "duckduckgo-search>=6,<8",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

